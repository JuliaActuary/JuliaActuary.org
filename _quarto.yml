project:
  type: website
  post-render:
    - python3 scripts/post-render.py
engines: ['julia']
julia:
    env: ["JULIA_NUM_THREADS=auto"]

website:
  title: "JuliaActuary"
  favicon: /assets/logos/favicon.ico
  site-url: "https://JuliaActuary.org"
  navbar:
    logo: /assets/logos/android-chrome-512x512.png
    href: index.qmd
    logo-alt: JuliaActuary Logo
    right:
      - packages.qmd
      - text: Docs
        href: https://docs.juliaactuary.org
      - learn.qmd
      - examples.qmd
      - community.qmd
      - benchmarks.qmd
      - blog.qmd
      - text: Book
        href: https://modernfinancialmodeling.com
      - icon: github
        aria-label: JuliaActuary on GitHub
        href: https://github.com/JuliaActuary
      - icon: rss
        aria-label: RSS feed
        href: all-posts.xml


format:
  html:
    engine: julia
    theme: assets/themes/cassette.scss
    css: styles.css
    monofont: JuliaMono
    mainfont: "Atkinson Hyperlegible"
    highlight-style: assets/themes/cassette.theme
    filters:
      - scripts/julia-repl.lua
    description: "JuliaActuary is an ecosystem of packages that makes Julia the easiest language to get started for actuarial workflows."
    header-includes:
      - |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
      - |
        <script data-goatcounter="https://juliaactuary.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

