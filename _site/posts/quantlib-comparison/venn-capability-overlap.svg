<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="title description">
  <title id="title">Shared tools, different modeling priorities</title>
  <desc id="description">Conceptual overlap between actuarial projections and trading models: cashflows, curves and risk. The areas do not quantify capability.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #263442; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 600; }
    .detail { font-size: 14px; }
    .note { font-size: 13px; fill: #5a6570; }
  </style>
  <text x="360" y="30" class="title">Shared tools, different modeling priorities</text>
  <circle cx="260" cy="185" r="128" fill="#4773aa" fill-opacity="0.2" stroke="#2d5380" stroke-width="2"/>
  <circle cx="460" cy="185" r="128" fill="#d17a4a" fill-opacity="0.2" stroke="#9c5532" stroke-width="2"/>
  <text x="225" y="142" class="label">Actuarial</text>
  <text x="225" y="166" class="label">projections</text>
  <text x="219" y="201" class="detail">Assumption models</text>
  <text x="219" y="225" class="detail">Multi-basis forecasts</text>
  <text x="219" y="249" class="detail">Portfolio scenarios</text>
  <text x="495" y="142" class="label">Trading</text>
  <text x="495" y="166" class="label">models</text>
  <text x="503" y="201" class="detail">Market conventions</text>
  <text x="503" y="225" class="detail">Instrument engines</text>
  <text x="503" y="249" class="detail">Settlement details</text>
  <text x="360" y="165" class="detail">Cashflows</text>
  <text x="360" y="190" class="detail">Curves</text>
  <text x="360" y="215" class="detail">Risk</text>
  <text x="360" y="347" class="note">Conceptual illustration; areas do not measure capability.</text>
</svg>
